# main 브랜치에 push(=PR 머지)되면 정적 사이트를 빌드해 GitHub Pages에 배포하는 워크플로우입니다.
#
# 사전 설정: 리포 Settings > Pages > Source를 "GitHub Actions"로 지정하고,
#           같은 화면의 Custom domain에 dohyuk.dev를 입력한다.
#           (이 방식에서는 리포에 CNAME 파일을 두지 않아도 된다)

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행 (연도가 바뀌었을 때 재빌드 등)

# Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 끝까지 마친다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # prebuild(이미지 동기화) -> next build 순서로 실행되어 out/ 이 만들어진다
      - run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
