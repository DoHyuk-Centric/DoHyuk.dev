# main 브랜치에 push(=PR 머지)되면 EC2에 앱을 자동으로 배포하는 워크플로우입니다.
#
# TODO: 현재는 EC2 안에서 git pull만 하고 next build 단계가 없어 그대로는 동작하지 않습니다.
#       아키텍처 설계문서 5.3절대로 "Actions에서 빌드 → 산출물만 EC2로 전송" 방식으로 재작성해야 합니다.
#       (t3.micro 1 GiB에서는 next build가 OOM으로 죽습니다)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # GitHub의 가상 컴퓨터에서, EC2 서버로 SSH 접속해서
      # 아래 script를 EC2 "안에서" 실행시켜주는 액션입니다.
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }} # EC2 퍼블릭 IP
          username: ${{ secrets.EC2_USER }} # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }} # 배포 전용 개인키
          script: |
            set -e
            cd ~/DoHyuk.dev

            # 최신 코드 받아오기
            git checkout main
            git pull origin main

            # 새로 추가된 의존성 설치
            pnpm install --frozen-lockfile

            # systemd 서비스 파일이 바뀌었을 수도 있으니 다시 복사 + 반영
            sudo cp deploy/systemd/dohuyk-server.service /etc/systemd/system/
            sudo systemctl daemon-reload

            # 새 코드로 재시작
            sudo systemctl restart dohuyk-server
