# 이 파일이 언제, 무엇을 하는지 정의하는 GitHub Actions 워크플로우 파일입니다.
# 저장소를 GitHub에 push하면, GitHub이 이 파일을 읽고 자동으로 실행합니다.

# ── 언제 실행할지 ──────────────────────────────
on:
  push:
    branches: [develop, main]
    paths-ignore: ["**/*.md", "docs/**", ".github/**", "deploy/**"] # 문서/워크플로우/배포 설정만 바뀌면 CI를 아예 트리거하지 않는다
  pull_request:
    branches: [develop, main]
    paths-ignore: ["**/*.md", "docs/**", ".github/**", "deploy/**"]

# 같은 브랜치에 연달아 push되면, 아직 안 끝난 이전 실행은 취소하고 최신 것만 돌린다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── 무엇을 실행할지 ──────────────────────────────
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # 1) 저장소 코드를 이 가상 컴퓨터로 복사해온다
      - uses: actions/checkout@v4

      # 2) pnpm 설치
      - uses: pnpm/action-setup@v4

      # 3) Node.js 설치 (버전 24, pnpm 패키지 캐시도 같이 활성화)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 4) 의존성 설치 (lockfile과 안 맞으면 실패시켜 버전 불일치를 방지)
      - run: pnpm install --frozen-lockfile

      # 5) Turborepo 캐시 복원 — 코드가 안 바뀐 패키지는 재실행을 건너뛴다
      #    커밋 해시로 못 찾으면(restore-keys) 가장 최근 캐시라도 부분 재사용
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # 6) 타입체크 + 단위 테스트(Vitest, web/server 양쪽)
      - run: pnpm turbo run typecheck test

      # 7) Playwright 브라우저 캐시 복원 — lockfile(=Playwright 버전)이 안 바뀌면
      #    아래 install 스텝에서 브라우저를 다시 다운로드하지 않는다
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # 8) 브라우저 설치 — 캐시가 있으면 다운로드는 건너뛰고 OS 의존성만 빠르게 확인
      - run: npx playwright install --with-deps chromium

      # 9) E2E 테스트(Playwright) — web 앱을 빌드/실행 후 브라우저로 접속해 검증
      - run: pnpm turbo run test:e2e
